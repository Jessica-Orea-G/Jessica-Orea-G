<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi experiencia AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #start {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      flex-direction: column;
      gap: 20px;
    }

    #start button {
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    #loading {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Pantalla inicial -->
  <div id="start">
    <h1>✨ Experiencia AR</h1>
    <p>Permite el acceso a tu cámara</p>

    <button id="startButton">
      Iniciar cámara 📷
    </button>

    <p id="loading">
      Cargando experiencia...
    </p>
  </div>


  <!-- ESCENA AR -->
  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Cámara -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- IMAGEN OBJETIVO -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- TU MODELO 3D -->
      <a-entity
        id="modelo"
        gltf-model="./model2.glb"
        position="0 0 0"
        scale="0 0 0"
        visible="false">
      </a-entity>

    </a-entity>

  </a-scene>


  <!-- Música -->
  <audio id="musica" src="./musica.mp3" loop></audio>


  <script>

    const startButton = document.getElementById("startButton");
    const startScreen = document.getElementById("start");
    const loading = document.getElementById("loading");

    const musica = document.getElementById("musica");
    const modelo = document.getElementById("modelo");

    const scene = document.querySelector("a-scene");


    // ==========================
    // INICIAR CÁMARA
    // ==========================

    startButton.addEventListener("click", async () => {

      loading.style.display = "block";
      startButton.style.display = "none";

      try {

        const mindarSystem =
          scene.systems["mindar-image-system"];

        await mindarSystem.start();

        startScreen.style.display = "none";

      } catch (error) {

        console.error(error);

        loading.innerHTML =
          "No se pudo iniciar la cámara 😢";

      }

    });


    // ==========================
    // IMAGEN DETECTADA
    // ==========================

    scene.addEventListener("targetFound", () => {

      console.log("🎯 Imagen detectada");

      modelo.setAttribute("visible", true);


      // Animación de aparición
      modelo.setAttribute(
        "animation__entrada",
        {
          property: "scale",
          from: "0 0 0",
          to: "0.5 0.5 0.5",
          dur: 1000,
          easing: "easeOutElastic"
        }
      );


      // ==========================
      // REPRODUCIR "ACTION" DEL GLB
      // ==========================

      const gltf = modelo.getObject3D("mesh");

      if (gltf && gltf.animations.length > 0) {

        const mixer = new THREE.AnimationMixer(gltf);

        const actionAnimation =
          gltf.animations.find(
            animation => animation.name === "Take 001"
          );

        if (actionAnimation) {

          const action =
            mixer.clipAction(actionAnimation);

          action.reset();
          action.play();

          // Actualizar la animación
          modelo.addEventListener("tick", () => {
            mixer.update(0.016);
          });

          console.log("▶️ Reproduciendo animación: Action");

        } else {

          console.log(
            "No se encontró una animación llamada Action"
          );

        }

      }


      // ==========================
      // MÚSICA
      // ==========================

      musica.volume = 0.5;

      musica.play().catch(error => {

        console.log(
          "El navegador bloqueó el audio:",
          error
        );

      });

    });


    // ==========================
    // IMAGEN PERDIDA
    // ==========================

    scene.addEventListener("targetLost", () => {

      console.log("❌ Imagen perdida");

      modelo.setAttribute("visible", false);

      musica.pause();
      musica.currentTime = 0;

    });

  </script>

</body>
</html>
